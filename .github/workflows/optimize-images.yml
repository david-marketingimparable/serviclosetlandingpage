name: Optimize website images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "*.html"
      - "*.css"
      - "*.js"
      - ".github/scripts/optimize_images.py"
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Convert images to WebP
        run: python .github/scripts/optimize_images.py
      - name: Commit optimized images and references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Optimize website images"
            git push
          else
            echo "No image optimizations needed."
          fi
